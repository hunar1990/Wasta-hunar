<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سێرڤیسی وەستا هونەر</title>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>

<style>
:root{
  /* Workshop at night: graphite panels, engine-oil gold accent. One column, phone first; bottom tab bar. */
  --bg:#111316; --panel:#1a1e23; --panel2:#22272e; --line:#2f353e;
  --text:#eef1f4; --mute:#97a1ac; --gold:#f2b33d; --gold-ink:#1b1405;
  --ok:#36c98a; --bad:#ff5d5d; --warn:#ff8a3d; --info:#5aa8ff;
  --display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"Noto Sans Arabic","Noto Kufi Arabic",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:20px} h3{font-size:16px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px 110px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--gold);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#1f5a41}.chip.bad{color:var(--bad);border-color:#6b2a2a}.chip.warn{color:var(--warn);border-color:#6b3c1f}.chip.gold{color:var(--gold);border-color:#6b5320}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.mute{color:var(--mute)} .small{font-size:13px} .tiny{font-size:12px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .goldt{color:var(--gold)}
.hero{background:radial-gradient(120% 140% at 100% 0%,#3a2c10 0%,var(--panel) 55%);border-color:#4a3a18}
.big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
.kpi .v{font-weight:700;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.tile b{font-size:14px;font-weight:600;line-height:1.3}
.tile .badge{position:absolute;top:8px;left:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:700;display:grid;place-items:center}
.tile .sub{font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.av{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--gold);flex:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.danger{background:#3a1717;color:#ffb3b3;border-color:#6b2a2a}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible,.li:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 2px -4px}
.sec-title h2{font-size:17px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(17,19,22,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer;padding:4px 0}
.nav button.on{color:var(--gold)}
.nav .plus{width:56px;height:56px;border-radius:18px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 20px rgba(242,179,61,.35)}
.bar-chart{width:100%;height:auto;display:block}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
.pill-due{font-size:12px;padding:2px 8px;border-radius:999px}
.tl{border-inline-start:2px solid var(--line);margin-inline-start:8px;padding-inline-start:14px}
.tl .ev{position:relative;padding:10px 0;cursor:pointer}
.tl .ev::before{content:"";position:absolute;inset-inline-start:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.tl .ev.pay::before{background:var(--ok)} .tl .ev.x::before{background:var(--bad)}
.tablelike{width:100%;border-collapse:collapse;font-size:14px}
.tablelike td,.tablelike th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tablelike th{color:var(--mute);font-weight:600;font-size:12px}
.partrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px;line-height:1}
.totals .r{display:flex;justify-content:space-between;padding:4px 0}
.totals .r.big2{font-family:var(--display);font-size:22px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.receipt{background:#fff;color:#141414;border-radius:6px;padding:22px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.receipt h1{font-size:22px;text-align:center}
.receipt .c{text-align:center}
.receipt .dash{border-top:2px dashed #bbb;margin:12px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td,.receipt th{padding:5px 2px;text-align:right;border-bottom:1px solid #eee}
.receipt th{font-size:12px;color:#666}
.receipt .tot{display:flex;justify-content:space-between;padding:3px 0}
.receipt .tot.b{font-weight:800;font-size:18px}
.receipt .stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);border:4px solid #d22;color:#d22;font-family:var(--display);font-size:34px;padding:4px 18px;border-radius:10px;opacity:.75}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;max-width:90%}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:#2a2112;border:1px solid #5a4418;color:#f6d690}
.pinwrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
.pins{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}
.pins i.f{background:var(--gold);border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.pad button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:700;cursor:pointer}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.staffpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.staffpick button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.staffpick button.on{border-color:var(--gold)}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:240px;overflow:auto}
.res div{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.res div:first-child{border-top:0}
.log-warn{border-inline-start:3px solid var(--warn);padding-inline-start:8px}
.log-bad{border-inline-start:3px solid var(--bad);padding-inline-start:8px}
.stockbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.stockbar i{display:block;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.big{font-size:28px}}
</style>
</head>

const toLat=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

const SV={oil:"ڕۆنگۆڕین",filter:"فلتەر گۆڕین",plug:"پلاک گۆڕین",nozzle:"نۆزڵ گۆڕین",pump:"فیت پەمپ گۆڕین",comp:"لێدانی کۆمپیوتەر",service:"سێرڤیس",repair:"چاککردنەوە",other:"تر"};

const SVASK={oil:"جۆری ڕۆن هەڵبژێرە",filter:"جۆری فلتەر هەڵبژێرە",plug:"جۆری پلاک هەڵبژێرە",nozzle:"جۆری نۆزڵ هەڵبژێرە",pump:"جۆری فیت پەمپ هەڵبژێرە"};
const CATS=["ڕۆن","فلتەر","پلاک","نۆزڵ","فیت پەمپ","پارچە","شلە","تر"];
const carLabel=c=>c?[c.brand,c.model,c.year].filter(Boolean).join(" ")||c.car||"":"";

const ICON={

 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.3 1.9 5 4.9"/>',
 box:'<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
 grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
 drop:'<path d="M12 3c3.5 4.4 6 7.7 6 11a6 6 0 0 1-12 0c0-3.3 2.5-6.6 6-11z"/>',
 wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.5 17.2a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.1-5.4l-2.4 2.4-2.3-.4-.4-2.3z"/>',
 debt:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/>',
 eye:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

 lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',

const ic=(n,s=22,c="currentColor")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- store ---------- */
const D={config:null,customers:{},items:{},jobs:{},payments:{},expenses:{},closings:{},logs:{},suppliers:{},purchases:{},spays:{},draws:{}};
let PERM_ERR=false,AUTH=null,FBU=null,DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:"saved"}}},DB=null,MODE="loading",READY=false,LOAD_SLOW=false,READONLY=false;
const LSK="wh_local_v1";
function localLoad(){try{const o=JSON.parse(localStorage.getItem(LSK)||"null");if(o)Object.assign(D,o)}catch(e){}}
function localSave(){try{localStorage.setItem(LSK,JSON.stringify(D))}catch(e){}}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){if(!a[k]||typeof a[k]!=="object")a[k]={};deepMerge(a[k],b[k])}else a[k]=b[k]}return a}
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
async function put(col,id,obj){
  if(MODE==="local"){if(col==="config")D.config=clone(obj);else D[col][id]=clone(obj);localSave();schedule();return}
  const ref=col==="config"?DB.doc("config/main"):DB.collection(col).doc(id);
  try{await ref.set(obj)}catch(e){dbFail(e);throw e}
}
async function merge(col,id,patch){
  if(MODE==="local"){deepMerge(D[col][id]||(D[col][id]={}),clone(patch));localSave();schedule();return}
  try{await DB.collection(col).doc(id).set(patch,{merge:true})}catch(e){dbFail(e);throw e}
}
function dbFail(e){
  const c=e&&e.code;
  if(c==="permission-denied"){toast("ڕێگەت پێ نادرێت. ئیمەیڵەکە لە یاساکانی Firebase دا نییە");}
  else if(c==="resource-exhausted")toast("سنووری بێبەرامبەری Firebase بۆ ئەمڕۆ تەواو بوو");
  else toast("تۆمار نەکرا، هێڵی ئینتەرنێت بپشکنە");
}
let renderQueued=false,dirty=false;
function schedule(){if(isFormBusy()){dirty=true;return}if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}
function isFormBusy(){return !!$(".modal-bg")||V.name==="newjob"||V.name==="purchase"||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))}
function subscribe(){
  let gotConfig=false;
  const timer=setTimeout(()=>{LOAD_SLOW=true;schedule()},10000);
  const onErr=e=>{clearTimeout(timer);if(e&&e.code==="permission-denied"){PERM_ERR=true;READY=true}LOAD_SLOW=true;schedule()};
  DB.doc("config/main").onSnapshot(s=>{
    D.config=s.exists?s.data():null;
    if(s.exists||!s.metadata.fromCache){gotConfig=true;READY=true;clearTimeout(timer);LOAD_SLOW=false;restoreSession()}
    schedule();
  },onErr);
  ["customers","items","jobs","payments","expenses","closings","suppliers","purchases","spays","draws"].forEach(col=>{
    DB.collection(col).onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});D[col]=o;schedule()},onErr);
  });
  DB.collection("logs").orderBy("d","desc").limit(45).onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});D.logs=o;schedule()},onErr);
}

/* ---------- derived data ---------- */
const jobsArr=()=>Object.entries(D.jobs).map(([id,j])=>({...j,id})).sort((a,b)=>b.t-a.t);
const activeJobs=()=>jobsArr().filter(j=>j.status!=="cancelled");
const paysArr=()=>Object.entries(D.payments).map(([id,p])=>({...p,id})).filter(p=>p.status!=="cancelled").sort((a,b)=>b.t-a.t);
const expArr=()=>Object.entries(D.expenses).map(([id,p])=>({...p,id})).filter(p=>p.status!=="cancelled").sort((a,b)=>b.t-a.t);
const custArr=()=>Object.entries(D.customers).map(([id,c])=>({...c,id})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ckb"));
const itemArr=()=>Object.entries(D.items).map(([id,i])=>({...i,id})).filter(i=>!i.hidden).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ckb"));
const arrOf=col=>Object.entries(D[col]).map(([id,x])=>({...x,id})).filter(x=>x.status!=="cancelled").sort((a,b)=>b.t-a.t);
const supArr=()=>Object.entries(D.suppliers).map(([id,c])=>({...c,id})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ckb"));
function supBal(sid){let d=0;arrOf("purchases").forEach(p=>{if(p.sid===sid)d+=(+p.debt||0)});arrOf("spays").forEach(p=>{if(p.sid===sid)d-=(+p.amount||0)});return Math.max(0,Math.round(d))}
const totalSupDebt=()=>supArr().reduce((s,x)=>s+supBal(x.id),0);
function supDue(){const out=[],soon=Date.now()+5*DAY;supArr().forEach(sp=>{const b=supBal(sp.id);if(b<=0)return;const ps=arrOf("purchases").filter(p=>p.sid===sp.id&&p.debt>0&&p.due).sort((a,b)=>a.due<b.due?-1:1);if(!ps.length)return;const nd=new Date(ps[0].due).getTime();if(nd<=soon)out.push({sp,b,nd,late:nd<startOfDay(Date.now())})});return out.sort((a,b)=>a.nd-b.nd)}
const qtyOf=it=>Object.values((it&&it.mv)||{}).reduce((s,m)=>s+(+m.d||0),0);
const isLow=it=>qtyOf(it)<=(+it.min||0);
function custDebt(cid){let d=0;activeJobs().forEach(j=>{if(j.cid===cid)d+=(+j.debt||0)});paysArr().forEach(p=>{if(p.cid===cid)d-=(+p.amount||0)});return Math.max(0,Math.round(d))}
function totalDebt(){return custArr().reduce((s,c)=>s+custDebt(c.id),0)}
function lastOil(cid,plate){return activeJobs().find(j=>j.cid===cid&&(j.services||[]).includes("oil")&&(!plate||j.plate===plate))}
function oilDue(){
  const out=[],soon=Date.now()+7*DAY;
  custArr().forEach(c=>{(c.cars&&c.cars.length?c.cars:[{plate:""}]).forEach(car=>{
    const j=lastOil(c.id,car.plate);if(!j||!j.nextDate)return;
    const nd=new Date(j.nextDate).getTime();if(nd<=soon)out.push({c,car,j,nd,late:nd<startOfDay(Date.now())});
  })});
  return out.sort((a,b)=>a.nd-b.nd);
}
function dayStats(day){
  const r={cashJobs:0,cashPay:0,exp:0,labor:0,parts:0,partsCost:0,disc:0,count:0,sales:0,newDebt:0,byStaff:{}};
  const S=n=>r.byStaff[n]||(r.byStaff[n]={cash:0,count:0,exp:0});
  activeJobs().forEach(j=>{if(dayKey(j.t)!==day)return;r.count++;r.cashJobs+=+j.paid||0;r.labor+=+j.labor||0;r.parts+=+j.partsTotal||0;r.partsCost+=+j.partsCost||0;r.disc+=+j.discount||0;r.sales+=+j.total||0;r.newDebt+=+j.debt||0;const s=S(j.staff);s.cash+=+j.paid||0;s.count++});
  paysArr().forEach(p=>{if(dayKey(p.t)!==day)return;r.cashPay+=+p.amount||0;S(p.staff).cash+=+p.amount||0});
  expArr().forEach(e=>{if(dayKey(e.t)!==day)return;r.exp+=+e.amount||0;S(e.staff).exp+=+e.amount||0});
  r.supCash=0;r.draws=0;
  arrOf("purchases").forEach(p=>{if(dayKey(p.t)===day&&p.fromCash){r.supCash+=+p.paid||0;S(p.staff).exp+=+p.paid||0}});
  arrOf("spays").forEach(p=>{if(dayKey(p.t)===day&&p.fromCash){r.supCash+=+p.amount||0;S(p.staff).exp+=+p.amount||0}});
  arrOf("draws").forEach(p=>{if(dayKey(p.t)===day){r.draws+=+p.amount||0;S(p.staff).exp+=+p.amount||0}});
  r.cashIn=r.cashJobs+r.cashPay;r.expected=r.cashIn-r.exp-r.supCash-r.draws;return r;
}
function rangeStats(from,to){
  const r={count:0,sales:0,labor:0,parts:0,partsCost:0,disc:0,cashJobs:0,cashPay:0,exp:0,newDebt:0,sv:{},items:{},staff:{}};
  activeJobs().forEach(j=>{if(j.t<from||j.t>=to)return;r.count++;r.sales+=+j.total||0;r.labor+=+j.labor||0;r.parts+=+j.partsTotal||0;r.partsCost+=+j.partsCost||0;r.disc+=+j.discount||0;r.cashJobs+=+j.paid||0;r.newDebt+=+j.debt||0;
    (j.services||[]).forEach(s=>r.sv[s]=(r.sv[s]||0)+1);(j.parts||[]).forEach(p=>{const x=r.items[p.name]||(r.items[p.name]={q:0,v:0});x.q+=+p.qty;x.v+=p.qty*p.price});
    const st=r.staff[j.staff]||(r.staff[j.staff]={count:0,sales:0,cash:0});st.count++;st.sales+=+j.total||0;st.cash+=+j.paid||0});
  paysArr().forEach(p=>{if(p.t<from||p.t>=to)return;r.cashPay+=+p.amount||0;const st=r.staff[p.staff]||(r.staff[p.staff]={count:0,sales:0,cash:0});st.cash+=+p.amount||0});
  expArr().forEach(e=>{if(e.t<from||e.t>=to)return;r.exp+=+e.amount||0});
  r.purch=0;r.supPaid=0;r.draws=0;arrOf("purchases").forEach(p=>{if(p.t>=from&&p.t<to){r.purch+=+p.total||0;r.supPaid+=+p.paid||0}});arrOf("spays").forEach(p=>{if(p.t>=from&&p.t<to)r.supPaid+=+p.amount||0});arrOf("draws").forEach(p=>{if(p.t>=from&&p.t<to)r.draws+=+p.amount||0});
  r.gross=r.labor+r.parts-r.partsCost-r.disc;r.net=r.gross-r.exp;return r;
}
